<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stack Ledger</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stack Ledger">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161e1b" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Crect x='3' y='15' width='20' height='6' rx='1.5' fill='%231d5b79'/%3E%3Crect x='5' y='9' width='16' height='6' rx='1.5' fill='%231d5b79' opacity='.7'/%3E%3Crect x='7' y='3' width='12' height='6' rx='1.5' fill='%231d5b79' opacity='.45'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: ledger app — sticky top bar, summary band, chart + allocation pair, holdings table; asset page mirrors it with a buy log. */
:root{
  --bg:#f2f4f1; --surface:#ffffff; --surface-2:#f7f8f6; --ink:#15201c; --muted:#5d6b65; --line:#dce2dd;
  --accent:#1d5b79; --accent-ink:#ffffff; --accent-soft:#e3edf2;
  --up:#1d8549; --up-soft:#e2f2e8; --down:#bf3d2b; --down-soft:#f8e5e1; --warn-soft:#fbf1dc; --warn-ink:#7a5410;
  --shadow:0 1px 2px rgba(20,32,28,.06),0 4px 16px rgba(20,32,28,.05);
  --f-display:"Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1412; --surface:#161e1b; --surface-2:#1b2421; --ink:#e5ece8; --muted:#92a19a; --line:#29342f;
    --accent:#7db4d2; --accent-ink:#0b1a22; --accent-soft:#1c2e38;
    --up:#4fc483; --up-soft:#173225; --down:#f0806b; --down-soft:#3a1f1a; --warn-soft:#33290f; --warn-ink:#e8c06a;
    --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1412; --surface:#161e1b; --surface-2:#1b2421; --ink:#e5ece8; --muted:#92a19a; --line:#29342f;
  --accent:#7db4d2; --accent-ink:#0b1a22; --accent-soft:#1c2e38;
  --up:#4fc483; --up-soft:#173225; --down:#f0806b; --down-soft:#3a1f1a; --warn-soft:#33290f; --warn-ink:#e8c06a;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em;text-decoration:none;color:var(--ink)}
.brand-mark{width:26px;height:26px;display:grid;place-items:center}
.top .spacer{flex:1}
.brand{white-space:nowrap}
@media (max-width:440px){.top .wrap{gap:6px}.brand{font-size:18px;gap:8px}.top .btn{padding:7px 10px}}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--down)}
.btn.danger.armed{background:var(--down);border-color:var(--down);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;padding-inline:8px}
.btn:focus-visible,.seg button:focus-visible,input:focus-visible,select:focus-visible,.row:focus-visible,.tx:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{padding-block:24px 64px;display:flex;flex-direction:column;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 18px 0}
.card-h h2{font-family:var(--f-display);font-size:17px;font-weight:600;margin:0;letter-spacing:-.005em}
.card-h .spacer{flex:1}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500}

.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);color:var(--warn-ink);border-radius:10px;padding:10px 14px;font-size:14px}
.banner .spacer{flex:1}
.banner .btn{background:transparent;border-color:currentColor;color:inherit;padding:5px 10px}

.summary{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 32px}
.big{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,6vw,48px);letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.sub-stats{display:flex;flex-wrap:wrap;gap:8px 24px;padding-bottom:6px}
.sub-stats div{display:flex;flex-direction:column;gap:2px}
.sub-stats b{font-family:var(--f-mono);font-weight:500;font-size:16px;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-family:var(--f-mono);font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.up{background:var(--up-soft);color:var(--up)} .pill.down{background:var(--down-soft);color:var(--down)} .pill.flat{background:var(--surface-2);color:var(--muted)}
.up{color:var(--up)} .down{color:var(--down)}

.grid2{display:grid;grid-template-columns:minmax(0,1.85fr) minmax(0,1fr);gap:20px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}

.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:6px;font-size:13px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.chart{position:relative;padding:10px 6px 10px 0;min-height:200px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .axis text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.chart .grid line{stroke:var(--line)}
.chart-empty{display:grid;place-items:center;min-height:220px;color:var(--muted);font-size:14px;text-align:center;padding:16px}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:8px 10px;font-size:12.5px;min-width:150px;z-index:2}
.tip .d{color:var(--muted);margin-bottom:4px}
.tip .r{display:flex;justify-content:space-between;gap:14px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tip .k{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-body);color:var(--muted)}
.tip i{width:8px;height:8px;border-radius:2px;display:inline-block}
.legend-inline{display:flex;gap:14px;font-size:12.5px;color:var(--muted);padding:0 18px}
.legend-inline span{display:inline-flex;align-items:center;gap:6px}
.legend-inline i{display:inline-block;width:14px;height:0;border-top:2px solid}

.alloc{display:flex;flex-direction:column;align-items:center;gap:16px;padding:16px 18px 18px}
.donut{position:relative;width:184px;max-width:100%}
.donut svg{display:block;width:100%;height:auto}
.donut .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut .c b{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.alloc ul{list-style:none;margin:0;padding:0;width:100%;display:flex;flex-direction:column;gap:8px}
.alloc li{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:10px;align-items:center;font-size:14px}
.alloc li i{width:12px;height:12px;border-radius:3px}
.alloc li .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alloc li .v{color:var(--muted);font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.alloc li .p{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums;min-width:52px;text-align:right}

.table{width:100%;border-collapse:collapse}
.tbl-wrap{overflow-x:auto;padding:8px 0 4px}
.table th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;text-align:right;padding:10px 18px;border-bottom:1px solid var(--line);white-space:nowrap}
.table td{padding:12px 18px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.table th:first-child,.table td:first-child{text-align:left}
.table tr:last-child td{border-bottom:0}
.row{cursor:pointer}
.row:hover td{background:var(--surface-2)}
.aname{display:flex;align-items:center;gap:10px;font-family:var(--f-body)}
.aname .sw{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:600;color:#fff;font-family:var(--f-mono);flex:none}
.aname b{font-weight:600}
.aname small{display:block;color:var(--muted);font-size:12.5px;font-family:var(--f-mono)}
.sym{color:var(--muted);font-family:var(--f-mono);font-size:12.5px}
@media (max-width:640px){.table .hide-sm{display:none}.table td,.table th{padding:10px 12px}}

.empty{padding:40px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--muted)}
.empty h3{margin:0;color:var(--ink);font-family:var(--f-display);font-size:20px}

/* asset page */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:14px;font-weight:500}
.back:hover{color:var(--ink)}
.ahead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ahead .sw{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;color:#fff;font-family:var(--f-mono);font-weight:600;font-size:13px}
.ahead h1{font-family:var(--f-display);font-size:30px;margin:0;letter-spacing:-.015em;line-height:1.1}
.ahead .spacer{flex:1}
.price-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 28px}
.price-row .unit{color:var(--muted);font-size:14px}
.pform{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pform input{width:150px}
.pform input[type=date]{width:150px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.stat{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat b{font-family:var(--f-mono);font-weight:500;font-size:18px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat small{color:var(--muted);font-size:12.5px}
.seg.mini{align-self:flex-start}
.seg.mini button{padding:2px 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
.src{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.src code{font-family:var(--f-mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:3px 7px;max-width:100%;overflow-wrap:anywhere;user-select:all;color:var(--ink)}
.src .btn{padding:4px 10px;font-size:13px}
a.btn{text-decoration:none;color:var(--ink)}

.txlist{max-height:520px;overflow-y:auto;padding:6px 0 8px}
.tx{display:grid;grid-template-columns:96px 52px minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:11px 18px;border-top:1px solid var(--line);cursor:pointer}
.tx:first-child{border-top:0}
.tx:hover{background:var(--surface-2)}
.tx .d{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.tx .t{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;border-radius:5px;padding:2px 6px;text-align:center}
.tx .t.buy{background:var(--up-soft);color:var(--up)} .tx .t.sell{background:var(--down-soft);color:var(--down)}
.tx .q{font-family:var(--f-mono);font-variant-numeric:tabular-nums;min-width:0}
.tx .q small{display:block;color:var(--muted);font-family:var(--f-body);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .tot{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.tx .tot small{display:block;color:var(--muted);font-size:12px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.live .dot{width:8px;height:8px;border-radius:50%;background:var(--up);flex:none}
.live.err .dot{background:var(--down)}
.live.off .dot{background:var(--line)}
.menu-list{display:flex;flex-direction:column;gap:10px}
.menu-list .btn{justify-content:flex-start;width:100%;padding:12px 14px}
.menu-list .btn small{margin-left:auto;color:var(--muted);font-weight:400}
.spin{display:inline-block}
@media (prefers-reduced-motion:no-preference){.spinning .spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}}
.ex-tag{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--warn-ink);background:var(--warn-soft);border-radius:4px;padding:1px 5px;margin-left:6px;font-family:var(--f-body)}
@media (max-width:520px){.tx{grid-template-columns:auto minmax(0,1fr) auto}.tx .d{grid-column:1/-1}}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,16,14,.45);z-index:20;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:min(460px,100%);max-height:100%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.sheet h2{font-family:var(--f-display);font-size:21px;margin:0;padding:18px 20px 0}
.form{display:flex;flex-direction:column;gap:14px;padding:16px 20px 20px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:500;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
input[type=text],input[type=number],input[type=date],select{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:9px 11px;min-width:0}
input.num{font-family:var(--f-mono)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{width:28px;height:28px;border-radius:7px;cursor:pointer;position:relative}
.swatches input{position:absolute;opacity:0;inset:0;cursor:pointer}
.swatches label:has(input:checked){outline:2px solid var(--ink);outline-offset:2px}
.swatches label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.form .seg{align-self:flex-start}
.calc{font-size:13px;color:var(--muted)}
.err{color:var(--down);font-size:13.5px;min-height:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actions .spacer{flex:1}
.hint{font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:pop .16s ease-out}@keyframes pop{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 26 26" width="26" height="26"><rect x="3" y="15" width="20" height="6" rx="1.5" style="fill:var(--accent)"/><rect x="5" y="9" width="16" height="6" rx="1.5" style="fill:var(--accent);opacity:.7"/><rect x="7" y="3" width="12" height="6" rx="1.5" style="fill:var(--accent);opacity:.45"/></svg>
      </span>
      Stack Ledger
    </a>
    <span class="spacer"></span>
    <button class="btn ghost" id="btn-refresh" type="button" data-act="refresh" aria-label="Refresh prices"><span class="spin" aria-hidden="true">↻</span></button>
    <button class="btn" type="button" data-act="menu">Backup</button>
    <button class="btn primary" id="btn-new-asset" type="button">+ New</button>
  </div>
</header>

<div class="wrap">
  <main id="view-home">
    <div id="home-banner"></div>
    <section class="summary" id="home-summary" aria-label="Portfolio summary">
      <div><div class="label">Portfolio value</div><div class="big">—</div></div>
    </section>
    <div class="grid2">
      <section class="card" aria-label="Portfolio equity curve">
        <div class="card-h"><h2>Equity curve</h2><span class="spacer"></span><div class="seg" id="home-range"></div></div>
        <div class="legend-inline" style="padding-top:8px"><span><i style="border-color:var(--accent)"></i>Value</span><span><i style="border-color:var(--muted);border-top-style:dashed"></i>Cost basis</span></div>
        <div class="chart" id="home-chart"><div class="chart-empty">Loading your stack…</div></div>
      </section>
      <section class="card" aria-label="Allocation">
        <div class="card-h"><h2>Allocation</h2></div>
        <div class="alloc" id="home-alloc"><div class="chart-empty">Loading…</div></div>
      </section>
    </div>
    <section class="card" aria-label="Holdings">
      <div class="card-h"><h2>Holdings</h2></div>
      <div id="home-table" class="tbl-wrap"></div>
    </section>
  </main>

  <main id="view-asset" hidden></main>
</div>

<div id="modal" class="scrim" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-6);
const SWATCHES = ['#8a97a8','#c9962b','#2a9d8f','#7b6cd9','#e0684b','#3b82c4','#5aa05a','#c95b8a'];
const UNITS = ['oz t','g','kg','token','coin','share','unit'];
const RANGES = [['1M',30],['3M',91],['6M',182],['1Y',365],['All',0]];

const S = { assets:new Map(), txns:new Map(), db:null, mode:'loading', range:'All', aRange:'All', aMode:'value', feeView:false };
try{ S.feeView = localStorage.getItem('sl-feeview')==='1'; }catch(_){}

/* ---------- formatting ---------- */
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(s,n){ const d=new Date(s+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function dayList(a,b){ const out=[]; let d=a, g=0; while(d<=b && g++<40000){ out.push(d); d=addDays(d,1); } return out; }
function fmtDate(s, mode){
  const d=new Date(s+'T00:00:00Z');
  const o = mode==='axisY' ? {month:'short',year:'2-digit'} : mode==='axis' ? {month:'short',day:'numeric'} : {month:'short',day:'numeric',year:'numeric'};
  return d.toLocaleDateString('en-US',{...o,timeZone:'UTC'});
}
function decimalsFor(a){ if(a===0||a>=1) return [2,2]; if(a>=0.01) return [2,4]; const max=Math.min(12, -Math.floor(Math.log10(a))+3); return [2,max]; }
function money(n, sign){
  if(n==null||!isFinite(n)) return '—';
  const [mn,mx]=decimalsFor(Math.abs(n));
  const s=n.toLocaleString('en-US',{style:'currency',currency:'USD',minimumFractionDigits:mn,maximumFractionDigits:mx});
  return (sign && n>0 ? '+' : '') + s;
}
function moneyAxis(n){
  const a=Math.abs(n);
  if(a>=1e6) return '$'+(n/1e6).toLocaleString('en-US',{maximumFractionDigits:1})+'M';
  if(a>=1e4) return '$'+(n/1e3).toLocaleString('en-US',{maximumFractionDigits:0})+'k';
  if(a>=1e3) return '$'+(n/1e3).toLocaleString('en-US',{maximumFractionDigits:1})+'k';
  return money(n);
}
function qty(n){ if(n==null||!isFinite(n)) return '—'; const a=Math.abs(n); return n.toLocaleString('en-US',{maximumFractionDigits: a>=1000?2 : a>=1?4 : 8}); }
function pct(n, sign=true){ if(n==null||!isFinite(n)) return '—'; return (sign&&n>0?'+':'')+(n*100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+'%'; }
function cls(n){ return n==null||Math.abs(n)<1e-12 ? 'flat' : n>0 ? 'up' : 'down'; }
function initials(a){ return esc((a.symbol||a.name||'?').slice(0,3).toUpperCase()); }

/* ---------- math ---------- */
function txFor(id){
  return [...S.txns.values()].filter(t=>t.assetId===id).sort((a,b)=> a.date<b.date?-1 : a.date>b.date?1 : (a.createdAt||0)-(b.createdAt||0));
}
function applyTx(st,t){
  const q=+t.qty||0, p=+t.price||0, f=+t.fee||0;
  if(t.type==='sell'){
    const avg = st.qty>0 ? st.cost/st.qty : 0; const qq=Math.min(q,st.qty);
    st.realized += qq*p - f - avg*qq; st.cost -= avg*qq; st.qty -= qq;
    if(st.qty<1e-12){ st.qty=0; st.cost=0; }
  } else { st.qty+=q; st.cost+=q*p+f; }
}
/* Spread vs spot: what you paid above spot on a buy, or gave up below spot on a sell. Only counted when spot was logged. */
function spreadOf(t){
  const s=+t.spot, p=+t.price, q=+t.qty||0;
  if(!(s>0) || !(p>=0)) return 0;
  return t.type==='sell' ? (s-p)*q : (p-s)*q;
}
function curPrice(a,tx){
  if(a.price!=null && a.price!=='' && isFinite(+a.price)) return +a.price;
  const last=[...tx].reverse().find(t=>+t.price>0); return last? +last.price : null;
}
function stats(a){
  const tx=txFor(a.id); const st={qty:0,cost:0,realized:0};
  let fees=0, spread=0, spent=0;
  tx.forEach(t=>{ applyTx(st,t); fees+=+t.fee||0; spread+=spreadOf(t); if(t.type!=='sell') spent+=(+t.qty||0)*(+t.price||0)+(+t.fee||0); });
  const price=curPrice(a,tx), value=st.qty*(price||0), pl=value-st.cost;
  return { tx, qty:st.qty, cost:st.cost, avg: st.qty>0? st.cost/st.qty : null, realized:st.realized, price, value, pl, plPct: st.cost>0? pl/st.cost : null, fees, spread, spent };
}
function pricePoints(a,tx){
  const m=new Map();
  tx.forEach(t=>{ if(+t.price>0) m.set(t.date,+t.price); });
  (a.history||[]).forEach(h=>{ if(h && h.d && isFinite(+h.p)) m.set(h.d,+h.p); });
  return [...m.entries()].sort((x,y)=>x[0]<y[0]?-1:x[0]>y[0]?1:0);
}
function daily(a,days){
  const tx=txFor(a.id), pts=pricePoints(a,tx);
  let ti=0, pi=0, price=null; const st={qty:0,cost:0,realized:0};
  const v=[], c=[], p=[], avg=[];
  for(const d of days){
    while(ti<tx.length && tx[ti].date<=d){ applyTx(st,tx[ti]); ti++; }
    while(pi<pts.length && pts[pi][0]<=d){ price=pts[pi][1]; pi++; }
    v.push(st.qty*(price||0)); c.push(st.cost); p.push(price); avg.push(st.qty>0? st.cost/st.qty : null);
  }
  return {v,c,p,avg};
}
function firstDate(ids){
  let f=null; S.txns.forEach(t=>{ if((!ids||ids.includes(t.assetId)) && t.date && (!f||t.date<f)) f=t.date; }); return f;
}
function cutIndex(days, range){
  const r=RANGES.find(x=>x[0]===range); if(!r||!r[1]) return 0;
  const cut=addDays(todayStr(), -r[1]); const i=days.findIndex(d=>d>=cut); return i<0?0:i;
}

/* ---------- charts ---------- */
function niceStep(raw){ const p=Math.pow(10,Math.floor(Math.log10(raw))); const f=raw/p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; }
function niceTicks(lo,hi,n){ const step=niceStep((hi-lo)/n||1); const s=Math.floor(lo/step)*step, e=Math.ceil(hi/step)*step; const out=[]; for(let v=s; v<=e+step*1e-6; v+=step) out.push(+v.toPrecision(12)); return out; }

let chartSeq=0;
function drawChart(el, days, lines, o={}){
  el._draw = () => drawChart(el, days, lines, o);
  if(days.length<2){ el.innerHTML=`<div class="chart-empty">${o.empty||'Log a buy to start the curve.'}</div>`; return; }
  const W=Math.max(280, el.clientWidth-6), H=o.h||250, L=62, R=12, T=12, B=28, iw=W-L-R, ih=H-T-B;
  let lo=Infinity, hi=-Infinity;
  lines.forEach(l=>l.data.forEach(v=>{ if(v!=null&&isFinite(v)){ lo=Math.min(lo,v); hi=Math.max(hi,v);} }));
  if(!isFinite(lo)){ el.innerHTML=`<div class="chart-empty">${o.empty||'No data yet.'}</div>`; return; }
  if(o.zero) lo=0; else { const sp=(hi-lo)||Math.abs(hi)*0.1||1; lo=Math.max(0,lo-sp*0.12); hi=hi+sp*0.12; }
  if(hi<=lo) hi=lo+(Math.abs(lo)*0.1||1);
  const ticks=niceTicks(lo,hi,4); lo=ticks[0]; hi=ticks[ticks.length-1];
  const n=days.length, x=i=>L+i/(n-1)*iw, y=v=>T+ih-(v-lo)/(hi-lo)*ih;
  const fmtY = o.fmtY || moneyAxis;
  const id='g'+(++chartSeq);
  const longSpan = (new Date(days[n-1])-new Date(days[0]))/864e5 > 300;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'Chart')}">`;
  s+=`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${lines[0].color};stop-opacity:.22"/><stop offset="1" style="stop-color:${lines[0].color};stop-opacity:0"/></linearGradient></defs>`;
  s+=`<g class="grid">`+ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"/>`).join('')+`</g>`;
  s+=`<g class="axis">`+ticks.map(t=>`<text x="${L-8}" y="${(y(t)+4).toFixed(1)}" text-anchor="end">${esc(fmtY(t))}</text>`).join('');
  const xt=Math.min(5,n); for(let k=0;k<xt;k++){ const i=Math.round(k*(n-1)/(xt-1)); const anchor=k===0?'start':k===xt-1?'end':'middle'; s+=`<text x="${x(i).toFixed(1)}" y="${H-6}" text-anchor="${anchor}">${esc(fmtDate(days[i], longSpan?'axisY':'axis'))}</text>`; }
  s+=`</g>`;
  lines.forEach((l,li)=>{
    let d='', area='', open=false, startX=null, lastX=null;
    l.data.forEach((v,i)=>{ if(v==null||!isFinite(v)){ open=false; return; } const px=x(i).toFixed(1), py=y(v).toFixed(1); d+=(open?'L':'M')+px+' '+py; if(!open&&startX===null) startX=px; lastX=px; open=true; });
    if(li===0 && o.fill!==false && d){ area=d+`L${lastX} ${T+ih}L${startX} ${T+ih}Z`; s+=`<path d="${area}" style="fill:url(#${id})"/>`; }
    s+=`<path d="${d}" style="fill:none;stroke:${l.color};stroke-width:${l.dash?1.5:2.2};${l.dash?'stroke-dasharray:5 4;':''}stroke-linejoin:round;stroke-linecap:round"/>`;
  });
  const lastI=n-1, lv=lines[0].data[lastI];
  if(lv!=null) s+=`<circle cx="${x(lastI)}" cy="${y(lv)}" r="4" style="fill:${lines[0].color};stroke:var(--surface);stroke-width:2"/>`;
  s+=`<g class="hover" style="display:none"><line y1="${T}" y2="${T+ih}" style="stroke:var(--muted);stroke-width:1;stroke-dasharray:2 3"/>`+lines.map(l=>`<circle r="4" style="fill:${l.color};stroke:var(--surface);stroke-width:2"/>`).join('')+`</g>`;
  s+=`<rect x="${L}" y="${T}" width="${iw}" height="${ih}" style="fill:transparent;cursor:crosshair"/></svg><div class="tip" hidden></div>`;
  el.innerHTML=s;
  const svg=el.querySelector('svg'), hov=svg.querySelector('.hover'), hl=hov.querySelector('line'), dots=hov.querySelectorAll('circle'), tip=el.querySelector('.tip'), rect=svg.querySelector('rect:last-of-type');
  const move=e=>{
    const r=svg.getBoundingClientRect(); const sx=(e.clientX-r.left)*(W/r.width);
    const i=Math.max(0,Math.min(n-1,Math.round((sx-L)/iw*(n-1)))); const px=x(i);
    hov.style.display=''; hl.setAttribute('x1',px); hl.setAttribute('x2',px);
    lines.forEach((l,k)=>{ const v=l.data[i]; if(v==null){ dots[k].style.display='none'; } else { dots[k].style.display=''; dots[k].setAttribute('cx',px); dots[k].setAttribute('cy',y(v)); } });
    tip.innerHTML=`<div class="d">${esc(fmtDate(days[i]))}</div>`+lines.map(l=>`<div class="r"><span class="k"><i style="background:${l.color}"></i>${esc(l.label)}</span><span>${l.data[i]==null?'—':esc((l.fmt||money)(l.data[i]))}</span></div>`).join('')+(o.extra?o.extra(i):'');
    tip.hidden=false;
    const cw=el.clientWidth, tx=(px/W)*r.width; const tw=tip.offsetWidth;
    tip.style.left=Math.max(4, Math.min(cw-tw-4, tx+14 > cw-tw-4 ? tx-tw-14 : tx+14))+'px'; tip.style.top='8px';
  };
  rect.addEventListener('pointermove',move); rect.addEventListener('pointerdown',move);
  rect.addEventListener('pointerleave',()=>{ hov.style.display='none'; tip.hidden=true; });
}

function donut(items, total){
  const r=62, C=2*Math.PI*r; let off=0; const gap=items.length>1?2:0;
  let s=`<svg viewBox="0 0 160 160" aria-hidden="true"><circle cx="80" cy="80" r="${r}" style="fill:none;stroke:var(--surface-2);stroke-width:22"/>`;
  items.forEach(it=>{ const len=Math.max(0,(it.v/total)*C-gap); if(len<=0){ off+= (it.v/total)*C; return; }
    s+=`<circle cx="80" cy="80" r="${r}" transform="rotate(-90 80 80)" style="fill:none;stroke:${it.color};stroke-width:22;stroke-dasharray:${len.toFixed(2)} ${C.toFixed(2)};stroke-dashoffset:${(-off).toFixed(2)}"/>`; off+=(it.v/total)*C; });
  return s+'</svg>';
}

/* ---------- views ---------- */

  if(!S.txns.size) return '';
  const m=loadMeta(); const WEEK=7*864e5;
  const unsaved = !m.lastBackup || (m.changedAt||0) > m.lastBackup;
  if(!unsaved || (m.lastBackup && Date.now()-m.lastBackup < WEEK)) return '';
  return `<div class="banner"><span>${m.lastBackup?`Your last backup was ${esc(ago(m.lastBackup))} and you’ve made changes since.`:'You haven’t saved a backup yet.'} Save one in case this browser’s data gets cleared.</span><span class="spacer"></span><button class="btn" type="button" data-act="backup">Save backup</button></div>`;
}
function segHTML(cur, act){ return RANGES.map(([k])=>`<button type="button" data-act="${act}" data-v="${k}" aria-pressed="${k===cur}">${k}</button>`).join(''); }

    <div class="sub-stats">

      <div><span class="label">Unrealized P/L</span><b class="${cls(pl)}">${esc(money(pl,true))} <span class="pill ${cls(pl)}">${esc(pct(tc>0?pl/tc:null))}</span></b></div>
      ${Math.abs(rz)>1e-9?`<div><span class="label">Realized P/L</span><b class="${cls(rz)}">${esc(money(rz,true))}</b></div>`:''}
      ${(()=>{ const f=rows.reduce((t,r)=>t+r.s.fees+r.s.spread,0); return f>1e-9?`<div><span class="label">Fees &amp; spread</span><b>${esc(money(f))}</b></div>`:''; })()}

  // equity curve

  else {

  }

  // allocation

    <ul>${pos.map(r=>`<li><i style="background:${esc(r.a.color||SWATCHES[0])}"></i><span class="n">${esc(r.a.name)}</span><span class="v">${esc(money(r.s.value))}</span><span class="p">${esc(pct(r.s.value/tv,false))}</span></li>`).join('')}</ul>`;

      <td class="hide-sm">${esc(money(s.price))}</td>
      <td class="hide-sm">${esc(money(s.avg))}</td>
      <td>${esc(money(s.value))}</td>

/* ---------- data writes ---------- */
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2600); }
function writeErr(e){ toast(e && e.code==='quota_exceeded' ? 'Storage is full. Delete some old transactions and try again.' : 'Couldn’t save that change. Check your connection and try again.'); console.error(e); }
/* Everything lives in this browser's storage under one key. Backup files are the safety net. */
const KEY='stackLedger.v1', META='stackLedger.meta';
function persist(){
  const body={assets:[...S.assets.values()], txns:[...S.txns.values()]};
  try{ localStorage.setItem(KEY, JSON.stringify(body)); }
  catch(e){ toast('Couldn’t save on this device. Your browser storage may be full or blocked.'); console.error(e); return false; }
  return true;
}
function loadMeta(){ try{ return JSON.parse(localStorage.getItem(META)||'{}')||{}; }catch(_){ return {}; } }
function saveMeta(patch){ const m={...loadMeta(),...patch}; try{ localStorage.setItem(META, JSON.stringify(m)); }catch(_){} return m; }
function changed(){ saveMeta({changedAt:Date.now()}); }
async function put(col,id,data){ S[col].set(id,{id,...data}); const ok=persist(); if(ok) changed(); route(); return ok; }
async function patch(col,id,data){ S[col].set(id,{...S[col].get(id),...data}); const ok=persist(); if(ok) changed(); route(); return ok; }
async function remove(col,id){ S[col].delete(id); const ok=persist(); if(ok) changed(); route(); return ok; }
function withPrice(a,p,d){
  const hist=(a.history||[]).filter(h=>h.d!==d).map(h=>({d:h.d,p:h.p})).concat([{d,p}]).sort((x,y)=>x.d<y.d?-1:1).slice(-3000);
  const latest=hist[hist.length-1];
  return {price:latest.p, priceDate:latest.d, history:hist};
}
async function savePrice(a,p,d){
  if(await patch('assets',a.id,{...withPrice(a,p,d), manualAt:Date.now()})) toast(`Price saved for ${fmtDate(d)}.`);
}

/* ---------- live prices ---------- */
const SOURCES={
  none:{label:'Manual only'},
  crypto:{label:'Crypto (paste contract or token ID)'},
  xag:{label:'Silver spot price'},
  xau:{label:'Gold spot price'},
  coingecko:{label:'CoinGecko coin ID'}
};
/* What kind of crypto ID was pasted. Hyperliquid token IDs are 0x + 32 hex; EVM contracts are 0x + 40 hex; Solana mints are base58. */
function cryptoKind(v){
  v=(v||'').trim();
  if(/^0x[0-9a-fA-F]{32}$/.test(v)) return 'hyperliquid';
  if(/^0x[0-9a-fA-F]{40}$/.test(v)) return 'evm';
  if(/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(v)) return 'solana';
  return null;
}
const KIND_LABEL={hyperliquid:'Hyperliquid', evm:'DexScreener', solana:'DexScreener'};
const OZT_G=31.1034768;
function metalFactor(unit){ const u=(unit||'').toLowerCase().replace(/\s|\./g,''); if(u==='g'||u==='gram'||u==='grams') return 1/OZT_G; if(u==='kg') return 1000/OZT_G; return 1; }

async function getJSON(url, opts={}){
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),12000);
  try{ const r=await fetch(url,{...opts,signal:ctl.signal}); if(!r.ok) throw new Error('HTTP '+r.status); return await r.json(); }
  finally{ clearTimeout(t); }
}
async function hyperliquidPrice(id){
  const post=body=>getJSON('https://api.hyperliquid.xyz/info',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  try{
    const d=await post({type:'tokenDetails',tokenId:id});
    const p=+(d&&(d.midPx||d.markPx)); if(p>0) return p;
  }catch(_){}
  const [meta,ctxs]=await post({type:'spotMetaAndAssetCtxs'});
  const tok=(meta.tokens||[]).find(t=>String(t.tokenId).toLowerCase()===id.toLowerCase());
  if(!tok) throw new Error('Hyperliquid doesn’t list that token ID.');
  const pair=(meta.universe||[]).find(u=>u.tokens && u.tokens[0]===tok.index && u.tokens[1]===0) || (meta.universe||[]).find(u=>u.tokens && u.tokens[0]===tok.index);
  if(!pair) throw new Error('No trading pair for this token on Hyperliquid yet.');
  const c=ctxs[pair.index]||{}; const p=+(c.midPx||c.markPx);
  if(!(p>0)) throw new Error('Hyperliquid has no price for this token right now.');
  return p;
}
async function dexPrice(addr){
  const d=await getJSON('https://api.dexscreener.com/latest/dex/tokens/'+encodeURIComponent(addr));
  const pairs=(d.pairs||[]).filter(p=>p.baseToken && String(p.baseToken.address).toLowerCase()===addr.toLowerCase() && +p.priceUsd>0);
  if(!pairs.length) throw new Error('Not listed on DexScreener right now.');
  pairs.sort((a,b)=>((b.liquidity&&b.liquidity.usd)||0)-((a.liquidity&&a.liquidity.usd)||0));
  return +pairs[0].priceUsd;
}
async function metalPrice(sym){
  try{ const d=await getJSON('https://api.gold-api.com/price/'+sym); const p=+d.price; if(p>0) return {p, via:'gold-api.com'}; }catch(_){}
  const id= sym==='XAG' ? 'kinesis-silver' : 'kinesis-gold';
  const d=await getJSON('https://api.coingecko.com/api/v3/simple/price?ids='+id+'&vs_currencies=usd');
  const p=+(d[id]&&d[id].usd); if(!(p>0)) throw new Error('Couldn’t get a spot price.');
  return {p, via:'CoinGecko (Kinesis)'};
}
async function coingeckoPrice(id){
  const d=await getJSON('https://api.coingecko.com/api/v3/simple/price?ids='+encodeURIComponent(id)+'&vs_currencies=usd');
  const p=+(d[id]&&d[id].usd); if(!(p>0)) throw new Error('CoinGecko has no price for “'+id+'”.'); return p;
}
async function fetchPrice(a){
  const src=a.source||'none', look=(a.lookup||'').trim();
  if(src==='xag'||src==='xau'){ const r=await metalPrice(src==='xag'?'XAG':'XAU'); return {p:r.p*metalFactor(a.unit), via:r.via+' spot'}; }
  if(src==='coingecko'){ if(!look) throw new Error('Add a CoinGecko coin ID.'); return {p:await coingeckoPrice(look.toLowerCase()), via:'CoinGecko'}; }
  if(src==='crypto'){
    const k=cryptoKind(look); if(!k) throw new Error('That doesn’t look like a contract address or token ID.');
    return k==='hyperliquid' ? {p:await hyperliquidPrice(look), via:'Hyperliquid'} : {p:await dexPrice(look), via:'DexScreener'};
  }
  return null;
}
let refreshing=false;
function refreshOne(id){ return refreshPrices(false, id); }
async function refreshPrices(manual, onlyId){
  if(refreshing) return; const live=[...S.assets.values()].filter(a=>a.source && a.source!=='none' && (!onlyId || a.id===onlyId));
  if(!live.length){ if(manual) toast('No assets have a live price source yet. Set one under Edit asset.'); return; }
  refreshing=true; document.getElementById('btn-refresh').classList.add('spinning');
  let ok=0, bad=0; const d=todayStr();
  for(const a of live){
    try{
      const r=await fetchPrice(a); if(!r) continue;
      const cur=S.assets.get(a.id); if(!cur) continue;
      S.assets.set(a.id,{...cur, ...withPrice(cur,r.p,d), liveAt:Date.now(), liveVia:r.via, liveErr:null}); ok++;
    }catch(e){
      const cur=S.assets.get(a.id); if(cur) S.assets.set(a.id,{...cur, liveErr: e.name==='AbortError' ? 'The price source took too long to answer.' : (e.message && !/^HTTP|fetch|network/i.test(e.message) ? e.message : 'Couldn’t reach the price source.'), liveErrAt:Date.now()}); bad++;
    }
  }
  persist(); if(!onlyId) saveMeta({lastRefresh:Date.now()});
  refreshing=false; document.getElementById('btn-refresh').classList.remove('spinning'); route();
  if(manual) toast(bad ? `Updated ${ok} of ${ok+bad} prices. Open an asset to see what failed.` : `Updated ${ok} price${ok===1?'':'s'}.`);
}
function ago(ts){ const s=(Date.now()-ts)/1000; if(s<60) return 'just now'; if(s<3600) return Math.round(s/60)+' min ago'; if(s<86400) return Math.round(s/3600)+' hr ago'; return Math.round(s/86400)+' days ago'; }

/* ---------- backup files ---------- */
function backupBody(){ return {app:'stack-ledger', version:1, exportedAt:new Date().toISOString(), assets:[...S.assets.values()], txns:[...S.txns.values()]}; }
async function saveBackup(){
  const name='stack-ledger-backup-'+todayStr()+'.json';
  const blob=new Blob([JSON.stringify(backupBody(),null,1)],{type:'application/json'});
  try{
    const file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'Stack Ledger backup'});
      saveMeta({lastBackup:Date.now()}); route(); toast('Backup saved.'); return;
    }
  }catch(e){ if(e && e.name==='AbortError'){ toast('Backup not saved.'); return; } }
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  saveMeta({lastBackup:Date.now()}); route(); toast('Backup downloaded: '+name);
}
function readBackup(file){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d || !Array.isArray(d.assets) || !Array.isArray(d.txns)) throw 0; res(d); }catch(_){ rej(new Error('That file isn’t a Stack Ledger backup.')); } }; r.onerror=()=>rej(new Error('Couldn’t read that file.')); r.readAsText(file); });
}
function restoreFrom(d){
  S.assets=new Map(d.assets.filter(a=>a&&a.id).map(a=>[a.id,a]));
  S.txns=new Map(d.txns.filter(t=>t&&t.id&&t.assetId).map(t=>[t.id,t]));
  if(persist()){ saveMeta({lastBackup:Date.now(), changedAt:Date.now()-1}); location.hash='home'; route(); toast(`Restored ${S.assets.size} assets and ${S.txns.size} transactions.`); }
}

      <div class="field"><label for="t-note">Note (optional)</label><input id="t-note" type="text" maxlength="80" value="${esc(t.note||'')}" placeholder="Dealer, coin type…"></div>
      <div class="calc" id="t-calc">Enter quantity and either the price per ${esc(unit)} or the total.</div>
      <div class="err" id="t-err"></div>
      <div class="actions">${isNew?'':`<button class="btn danger" type="button" id="t-del">Delete</button>`}<span class="spacer"></span><button class="btn" type="button" id="t-cancel">Cancel</button><button class="btn primary" type="submit">${isNew?'Save':'Save changes'}</button></div>
    </form>`, sh=>{
    const q=sh.querySelector('#t-qty'), p=sh.querySelector('#t-price'), tot=sh.querySelector('#t-total'), fee=sh.querySelector('#t-fee'), calc=sh.querySelector('#t-calc');
    const sign=()=>type==='sell'?-1:1;
    const fromPrice=()=>{ const Q=+q.value, P=+p.value, F=+fee.value||0; if(Q>0 && p.value!=='') tot.value=+(Q*P+sign()*F).toFixed(8); show(); };
    const fromTotal=()=>{ const Q=+q.value, T=+tot.value, F=+fee.value||0; if(Q>0 && tot.value!=='') p.value=+((T-sign()*F)/Q).toPrecision(10); show(); };
    const spotEl=sh.querySelector('#t-spot');
    const show=()=>{ const Q=+q.value, P=+p.value, F=+fee.value||0, SP=+spotEl.value;
      if(!(Q>0 && p.value!=='')){ calc.textContent=`Enter quantity and either the price per ${unit} or the total.`; return; }
      let txt=`${qty(Q)} ${unit} × ${money(P)}${F?` ${type==='sell'?'−':'+'} ${money(F)} fees`:''} = ${money(Q*P+sign()*F)} ${type==='sell'?'received':'paid'} · effective ${money((Q*P+sign()*F)/Q)} per ${unit}`;
      if(SP>0){ const per = type==='sell' ? SP-P : P-SP; txt += type==='sell' ? ` · ${money(per)}/${unit} below spot (${money(per*Q)} total)` : ` · ${money(per)}/${unit} over spot (${money(per*Q)} total)`; }
      calc.textContent=txt; };
    spotEl.oninput=show;
    let lastEdit='price';
    q.oninput=()=> lastEdit==='total'?fromTotal():fromPrice();
    p.oninput=()=>{ lastEdit='price'; fromPrice(); };
    tot.oninput=()=>{ lastEdit='total'; fromTotal(); };
    fee.oninput=()=> lastEdit==='total'?fromTotal():fromPrice();
    sh.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ type=b.dataset.t; sh.querySelectorAll('[data-t]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.t===type)); sh.querySelector('#t-total-l').textContent= type==='sell'?'Total received':'Total paid'; lastEdit==='total'?fromTotal():fromPrice(); });
    fromPrice();
    sh.querySelector('#t-cancel').onclick=closeModal;
    const del=sh.querySelector('#t-del');
    if(del) del.onclick=async()=>{ if(!del.classList.contains('armed')){ del.classList.add('armed'); del.textContent='Confirm delete'; return; } if(await remove('txns',t.id)){ closeModal(); toast('Transaction deleted.'); } };
    sh.querySelector('form').onsubmit=async e=>{
      e.preventDefault(); const err=sh.querySelector('#t-err');
      const Q=parseFloat(q.value), P=parseFloat(p.value), F=parseFloat(fee.value)||0, D=sh.querySelector('#t-date').value;
      if(!D) return err.textContent='Pick a date.';
      if(!(Q>0)) return err.textContent='Quantity must be more than 0.';
      if(!(P>=0)) return err.textContent='Enter a price per '+unit+' or a total.';
      if(type==='sell'){ const st={qty:0,cost:0,realized:0}; txFor(assetId).filter(x=>x.id!==t.id && x.date<=D).forEach(x=>applyTx(st,x)); if(Q>st.qty+1e-9) return err.textContent=`You held ${qty(st.qty)} ${unit} on that date, so you can't sell ${qty(Q)}.`; }
      const SP=parseFloat(spotEl.value);
      const data={assetId,type,date:D,qty:Q,price:P,fee:F,spot: SP>0?SP:null,note:sh.querySelector('#t-note').value.trim(),createdAt:t.createdAt||Date.now()};
      if(await put('txns', t.id||uid(), data)){ closeModal(); toast(isNew?'Transaction logged.':'Transaction updated.'); }
    };
  });
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, id=b.dataset.id;
  if(act==='open') location.hash='asset-'+id;
  else if(act==='new-asset') assetForm();
  else if(act==='edit-asset') assetForm(S.assets.get(id));
  else if(act==='new-tx') txForm(id);
  else if(act==='edit-tx'){ const t=S.txns.get(id); t && txForm(t.assetId,t); }
  else if(act==='range'){ S.range=b.dataset.v; renderHome(); }
  else if(act==='arange'){ S.aRange=b.dataset.v; route(); }
  else if(act==='amode'){ S.aMode=b.dataset.v; route(); }
  else if(act==='feeview'){ S.feeView = b.dataset.v==='fees'; try{ localStorage.setItem('sl-feeview', S.feeView?'1':'0'); }catch(_){} route(); }
  else if(act==='copy'){ const v=b.dataset.v; const done=()=>toast('Copied.'); try{ navigator.clipboard.writeText(v).then(done,()=>toast('Select the text and copy it manually.')); }catch(_){ toast('Select the text and copy it manually.'); } }
  else if(act==='refresh') refreshPrices(true);
  else if(act==='menu') menuModal();
  else if(act==='backup') saveBackup();
});
document.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ') && e.target.matches('.row,.tx')){ e.preventDefault(); e.target.click(); } });
$('#btn-new-asset').onclick=()=>assetForm();

/* ---------- boot ---------- */
/* First run starts with your two assets set up and no buys. */
const STARTER=[
  {id:'silver', name:'Silver', symbol:'AG', unit:'oz t', color:'#8a97a8', source:'xag', lookup:'', link:'', createdAt:1, history:[], price:null, priceDate:null},
  {id:'trend', name:'TREND', symbol:'TREND', unit:'token', color:'#2a9d8f', source:'crypto', lookup:'0x34fc4f2dac4e69240efefd86729d6627', link:'https://app.hyperliquid.xyz/explorer/token/0x34fc4f2dac4e69240efefd86729d6627', createdAt:2, history:[], price:null, priceDate:null}
];
function boot(){
  let raw=null; try{ raw=localStorage.getItem(KEY); }catch(_){ toast('This browser is blocking storage, so nothing will be saved. Turn off private browsing.'); }
  let d=null; try{ d=raw?JSON.parse(raw):null; }catch(_){ d=null; }
  if(d && Array.isArray(d.assets)){
    S.assets=new Map(d.assets.filter(a=>a&&a.id).map(a=>[a.id,a]));
    S.txns=new Map((d.txns||[]).filter(t=>t&&t.id).map(t=>[t.id,t]));
  } else if(!raw){
    STARTER.forEach(a=>S.assets.set(a.id,{...a})); persist();
  }
  S.mode='ready'; route();
  try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(_){}
  const stale=()=>Date.now()-(loadMeta().lastRefresh||0) > 10*60*1000;
  if(stale()) refreshPrices(false);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && stale()) refreshPrices(false); });
}
boot();
})();
</script>
